name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install GNOME build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs \
            libglib2.0-bin \
            gnome-shell

      - name: Validate schema and build extension zip
        run: make check

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
