<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AI Search</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f3f"/>
      <stop offset="1" stop-color="#2f2f2f"/>
    </linearGradient>

    <!-- Handle silhouette: narrow neck flaring out of the ring into a stadium -->
    <path id="handle" d="M 196.99 304.97
      L 185.15 316.81
      C 183.91 318.05 169.67 303.81 152.35 321.13
      L 91.40 382.09
      A 29.76 29.76 0 0 0 133.48 424.17
      L 194.44 363.22
      C 211.76 345.90 197.52 331.66 198.76 330.42
      L 211.05 318.13
      A 132.15 132.15 0 0 1 196.99 304.97 Z"/>

    <!-- White glyph = ring band + handle, minus lens and handle cavity -->
    <mask id="glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <circle cx="294.07" cy="215.31" r="120.35" fill="none" stroke="#fff" stroke-width="23.6"/>
      <use href="#handle" fill="#fff"/>
      <circle cx="294.07" cy="215.31" r="108.54" fill="#000"/>
      <line x1="172.45" y1="343.12" x2="113.06" y2="402.51" stroke="#000" stroke-width="29.76" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="48" fill="url(#tile)"/>

  <!-- Magnifier -->
  <rect width="512" height="512" fill="#fff" mask="url(#glyph)"/>

  <!-- Neural graph inside the lens -->
  <g fill="none" stroke="#d9dee8" stroke-width="5.3" stroke-linecap="round">
    <path d="M295.82 166.29 L232.81 191.67
             M295.82 166.29 L356.21 217.05
             M295.82 166.29 L232.81 242.44
             M232.81 191.67 L295.82 217.05
             M232.81 191.67 L294.95 268.69
             M232.81 242.44 L295.82 217.05
             M232.81 242.44 L294.95 268.69
             M294.95 268.69 L356.21 217.05
             M356.21 217.05 L295.82 217.05"/>
  </g>
  <g fill="#d9dee8">
    <circle cx="295.82" cy="166.29" r="12.7"/>
    <circle cx="232.81" cy="191.67" r="12.7"/>
    <circle cx="232.81" cy="242.44" r="12.7"/>
    <circle cx="294.95" cy="268.69" r="12.7"/>
    <circle cx="356.21" cy="217.05" r="12.7"/>
    <circle cx="295.82" cy="217.05" r="12.7"/>
  </g>
</svg>
